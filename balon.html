<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pecah Balon</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#bfe6ff;--ink:#1d2a44}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#27407a}}
:root[data-theme="dark"]{--bg:#27407a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"Nunito","Trebuchet MS",sans-serif;color:var(--ink)}
#app{position:relative;height:100%}
.stage{position:absolute;inset:0;overflow:hidden}
.lv{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:4vmin;flex-wrap:wrap;padding:88px 4vmin 4vmin}
.lb{width:min(28vmin,230px);aspect-ratio:1;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.lb:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.lb b{font-size:min(13vmin,100px);line-height:1;font-weight:400}
.lb span{font-size:min(8vmin,64px);font-weight:800}
#home{position:fixed;z-index:9;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:30px;padding:0;transition:transform .5s,background .5s}
#home.hold{transform:scale(1.3);background:#ffd21f}
#st{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 10px);left:80px;right:12px;text-align:center;font-size:34px;pointer-events:none}
.bl{position:absolute;bottom:-1.4em;line-height:1;animation:rise linear forwards;filter:hue-rotate(var(--h,0deg))}
.bl span{display:block;animation:sway 2.2s ease-in-out infinite alternate}
.bl span.pop{animation:pop .4s forwards}
.sp{position:fixed;z-index:3;font-size:32px;pointer-events:none;animation:sp .6s ease-out forwards}
@keyframes rise{to{transform:translateY(-135vh)}}
@keyframes sway{from{transform:translateX(-18px) rotate(-4deg)}to{transform:translateX(18px) rotate(4deg)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="st"></div>
<button id="home" aria-label="Kembali">🏠</button>
<script>
const app=document.getElementById('app'),home=document.getElementById('home'),st=document.getElementById('st');
let KA=null,primed=false,timer=null,homeAct=null;
const WC={};
const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
const LV=[
  {e:'🐢',n:1,bg:'#c9f0d3',dur:18,gap:1800,max:5,say:'Satu. Pelan sekali.'},
  {e:'🐇',n:2,bg:'#ffe9a8',dur:11,gap:1100,max:8,say:'Dua. Sedang.'},
  {e:'🐆',n:3,bg:'#ffc9a8',dur:6.5,gap:700,max:11,say:'Tiga. Cepat.'}
];

/* suara: elemen audio supaya tetap bunyi di iPhone */
function unlock(){
  try{
    if(!KA){KA=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');KA.loop=true}
    if(KA.paused)KA.play().catch(()=>{});
    if(!primed){primed=true;speechSynthesis.speak(new SpeechSynthesisUtterance(''))}
  }catch(e){}
}
['pointerdown','touchend','click'].forEach(v=>addEventListener(v,unlock,true));
let VO=null;
function pick(){try{const v=speechSynthesis.getVoices();VO=v.find(x=>/^id/i.test(x.lang)&&/female|damayanti|gadis/i.test(x.name))||v.find(x=>/^id/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(VO)u.voice=VO;u.rate=.9;u.pitch=1;setTimeout(()=>speechSynthesis.speak(u),60)}catch(e){}}
function wav(f,d,type,v){
  const sr=22050,n=Math.floor(sr*d),b=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)b.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const t=i/sr,e=Math.min(1,i/(sr*.01))*Math.pow(1-i/n,2);
    let x;
    if(!f)x=(Math.random()*2-1)*Math.pow(1-i/n,3);
    else if(type==='tri')x=(2/Math.PI)*Math.asin(Math.sin(2*Math.PI*f*t));
    else x=Math.sin(2*Math.PI*f*t);
    b.setInt16(44+i*2,Math.max(-1,Math.min(1,x*e*v))*32767,true);
  }
  const u=new Uint8Array(b.buffer);let s='';
  for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,'+btoa(s);
}
function pre(key,mk){if(!WC[key]){const a=new Audio(mk());a.preload='auto';WC[key]=a}return WC[key]}
function play(key,mk){const a=pre(key,mk);try{a.currentTime=0}catch(e){}const p=a.play();if(p&&p.catch)p.catch(()=>{})}
function tone(f,d,type,v){play('t'+f+type,()=>wav(f,d,type==='triangle'?'tri':'sin',v))}
function poof(){play('p',()=>wav(0,.08,'n',.5))}
function warm(){
  NOTES.forEach(f=>pre('t'+f+'sine',()=>wav(f,.4,'sin',.35)));
  [523.25,659.25,783.99,1046.5].forEach(f=>pre('t'+f+'triangle',()=>wav(f,.5,'tri',.35)));
  pre('p',()=>wav(0,.08,'n',.5));
}

/* layar pilih kecepatan */
function levels(){
  clearInterval(timer);try{speechSynthesis.cancel()}catch(e){}
  st.textContent='';
  app.innerHTML='';
  homeAct=()=>{try{location.href='index.html'}catch(e){}};
  const w=document.createElement('div');w.className='lv';
  LV.forEach((L,i)=>{
    const b=document.createElement('div');b.className='lb';b.style.background=L.bg;
    b.innerHTML='<b>'+L.e+'</b><span>'+L.n+'</span>';
    b.onclick=()=>{say(L.say);setTimeout(()=>mulai(L),900)};
    w.appendChild(b);
  });
  app.appendChild(w);
}

/* permainan */
function mulai(L){
  app.innerHTML='';homeAct=levels;
  const s=document.createElement('div');s.className='stage';app.appendChild(s);
  let cnt=0,stars=0;
  const mk=init=>{
    if(s.querySelectorAll('.bl').length>=L.max)return;
    const d=document.createElement('div'),dur=L.dur*(0.85+Math.random()*0.3);
    d.className='bl';
    d.style.cssText='left:'+(4+Math.random()*80)+'%;font-size:'+(110+Math.random()*60)+'px;--h:'+Math.floor(Math.random()*12)*30+'deg;animation-duration:'+dur+'s;animation-delay:'+(init?-Math.random()*dur*.7:0)+'s';
    d.innerHTML='<span>🎈</span>';
    d.onpointerdown=()=>{
      d.onpointerdown=null;
      const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.4;
      tone(NOTES[Math.floor(Math.random()*7)],.4,'sine',.35);poof();
      d.firstChild.className='pop';d.firstChild.textContent='💥';
      setTimeout(()=>d.remove(),450);
      for(let k=0;k<6;k++){
        const p=document.createElement('div');p.className='sp';p.textContent=k%2?'✨':'⭐';
        p.style.left=cx+'px';p.style.top=cy+'px';
        const a=Math.random()*6.28,m=60+Math.random()*80;
        p.style.setProperty('--dx',Math.cos(a)*m+'px');p.style.setProperty('--dy',Math.sin(a)*m+'px');
        document.body.appendChild(p);setTimeout(()=>p.remove(),650);
      }
      if(++cnt%5===0){
        stars++;st.textContent='⭐'.repeat(Math.min(stars,12));
        [523.25,659.25,783.99,1046.5].forEach((f,j)=>setTimeout(()=>tone(f,.5,'triangle',.35),j*130));
      }
    };
    d.onanimationend=e=>{if(e.target===d)d.remove()};
    s.appendChild(d);
  };
  for(let k=0;k<Math.ceil(L.max/2);k++)mk(1);
  timer=setInterval(()=>mk(0),L.gap);
}

/* tombol rumah: tahan setengah detik */
let ht=null;
home.onpointerdown=()=>{home.classList.add('hold');ht=setTimeout(()=>{home.classList.remove('hold');homeAct&&homeAct()},500)};
['pointerup','pointerleave','pointercancel'].forEach(v=>home.addEventListener(v,()=>{clearTimeout(ht);home.classList.remove('hold')}));
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(v=>document.addEventListener(v,e=>e.preventDefault()));
levels();warm();
</script>
</body>
</html>
